name: Actualizar calendario

# RESPALDO "dead-man's switch". El escritor principal es el updater de Hermes
# (cron diario 08:00 + vigilante cada 15 min). Este workflow SOLO publica si
# Hermes lleva >24 h sin commitear (es decir, el LXC está caído). Mientras Hermes
# esté vivo, este run no hace nada y no pisa nada.
#
#   workflow_dispatch  -> fuerza la actualización ignorando el umbral.
#   schedule (03:00 UTC)-> respaldo diario, solo actúa si Hermes está caído >24 h.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install requests
      - name: Ejecutar scraper
        run: python scraper.py
      - name: Publicar solo si Hermes está caído
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_h=$(( (now - last) / 3600 ))
          echo "Último commit hace ${age_h}h"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$age_h" -lt 24 ]; then
            echo "Hermes activo (último commit < 24h). Respaldo no necesario; salgo sin pushear."
            exit 0
          fi
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza calendario (respaldo) $(date -u +%F\ %H:%M)"
            git pull --rebase -X theirs origin main
            git push
          fi
