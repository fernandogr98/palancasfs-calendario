name: Actualizar calendario

# SOLO manual (workflow_dispatch). El escritor automático es el updater de Hermes
# (cron diario 08:00 + vigilante cada 15 min). Antes esto también corría cada 6 h
# por schedule y pisaba al updater de Hermes, provocando rechazos de push
# ("remote contains work that you do not have locally") por doble escritor.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install requests
      - name: Ejecutar scraper
        run: python scraper.py
      - name: Commit y push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza calendario $(date -u +%F\ %H:%M)"
            git pull --rebase origin main
            git push
          fi
