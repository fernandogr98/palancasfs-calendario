name: Actualizar calendario

# Escritor automático principal: updater de Hermes (cron diario 08:00 + vigilante
# cada 15 min). Este workflow es un RESPALDO diario que mantiene la web al día
# aunque el LXC de Hermes esté apagado. Corre 1×/día a una hora que no pisa a
# Hermes (03:00 UTC = 04:00 Madrid; Hermes base = 07:00 UTC, vigilante 10-22+23,0,1 UTC).
# Ambos escritores hacen commit → pull --rebase → push, así que no se pisan.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install requests
      - name: Ejecutar scraper
        run: python scraper.py
      - name: Commit y push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza calendario $(date -u +%F\ %H:%M)"
            git pull --rebase origin main
            git push
          fi
